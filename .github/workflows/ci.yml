name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# [264] Least privilege; the workflow uses no secrets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: drum-pattern-vst

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Rust
        # Pinned to the same toolchain as rust-toolchain.toml / the shipped binary.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.94.0"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            drum-pattern-vst -> target

      - name: Check
        run: cargo check --all-targets --locked
        env:
          DRUM_PATTERN_BUILD_ID: ci-${{ github.run_number }}
          # Warnings are errors: the build is warning-clean and must stay so.
          RUSTFLAGS: -D warnings

      - name: Test
        run: cargo test --locked
        env:
          DRUM_PATTERN_BUILD_ID: ci-${{ github.run_number }}
          # [263] Hermetic tests: never touch the runner's real user config.
          FLASH_DRUM_CONFIG_DIR: ${{ runner.temp }}/flash-drum-config

      - name: Clippy
        # -D warnings would promote all style lints to errors; deny the
        # categories that catch real bugs. excessive_precision is allowed at
        # module level on the ac606 FIR table ([268]).
        run: cargo clippy --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

      - name: Vendored egui-baseview tests (file_drop bridge)
        run: cargo test --locked -p egui-baseview --lib

      - name: Build release bundle
        shell: pwsh
        run: .\build.ps1

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drum-pattern-vst-windows
          path: drum-pattern-vst/build/drum-pattern-vst.vst3
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.94.0"

      - name: Check (macOS portability)
        run: cargo check --all-targets --locked
        env:
          # unexpected_cfgs: the vendored nih-plug's objc macros trip it on
          # macOS; not ours to fix. Everything else stays an error.
          RUSTFLAGS: -D warnings -A unexpected_cfgs
