[package]
name = "drum-pattern-vst"
version = "0.9.5"
edition = "2021"
authors = ["Flash Drum"]
description = "A 64-step drum sequencer VST3 plugin"
# [266] SPDX identifier (the deprecated "GPL-3.0" form warned on publish);
# the full text lives in LICENSE at the repo root and ships in the bundle.
license = "GPL-3.0-only"

[[bin]]
name = "test_standalone"
path = "src/bin/test_standalone.rs"

[[bin]]
name = "drum-pattern-midi-drag-helper"
path = "src/bin/midi_drag_helper.rs"

[dependencies]
nih_plug = { path = "vendor/nih-plug" }
nih_plug_egui = { path = "vendor/nih-plug/nih_plug_egui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_arrays = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
egui_extras = { version = "0.31", default-features = false, features = ["image"] }
crossbeam = "0.8"
# [228] User textures for Rift: WAV decoding, lock-free slot swapping read
# from the audio thread, and the native file dialog (Windows IFileDialog,
# macOS NSOpenPanel; no GTK backend, Linux is not a target).
hound = "3.5"
arc-swap = "1"
# [260] Real per-user folders (OneDrive-aware Documents, macOS home) —
# replaces the hand-rolled USERPROFILE logic forbidden by the portability rule.
dirs = "6"
rfd = { version = "0.15", default-features = false }
# [271] "Open folder" in the MIDI export confirmation modal.
open = "5"
# [280] Inflates the starter presets embedded by build.rs (already in the
# tree through png, no new crate).
miniz_oxide = "0.9"

# [267] Windows-only (MIDI drag helper, ui/midi.rs) — not fetched on macOS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # [281] perf_log.rs: RSS/handles/GDI sampling for the Bitwig lag report.
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
crate-type = ["cdylib"]
name = "drum_pattern_vst"
path = "src/lib.rs"

[build-dependencies]
# [280] Deflates assets/presets/default-user/ into OUT_DIR.
miniz_oxide = "0.9"

[dev-dependencies]
# [254] Allocation watchdog for the real-time safety tests. Same fork and
# revision as nih-plug's `assert_process_allocs` feature (nested
# permit/forbid), pinned by rev — never by branch.
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", rev = "a6fb4f62b9624715291e320ea5f0f70e73b035cf" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
# [258] Line tables land in the PDB (separate from the stripped DLL) so a
# crash on an older build stays symbolisable from build/symbols/.
debug = "line-tables-only"
